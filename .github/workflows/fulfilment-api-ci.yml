name: Fulfilment API CI

on:
  pull_request:
    paths:
      - 'apps/fulfilment-api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fulfilment-api-ci.yml'

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    # DATABASE_URL is set because the root postinstall builds @faira/db
    # (prisma generate needs a resolvable — not reachable — URL).
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Fresh install (the Windows lockfile omits linux native bindings; npm
      # install won't repair them with a lockfile present — npm bug #4828).
      - name: Install dependencies
        run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint -w fulfilment-api

      - name: Unit tests
        run: npm run test -w fulfilment-api

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/fulfilment-api/Dockerfile -t fulfilment-api:ci .
